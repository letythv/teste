<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interativa de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora Interativa de Compras</h1>
            <button id="temaBtn" onclick="alternarTema()">Modo Escuro</button>
        </header>
        <form id="formCompra">
            <label for="nome">Nome do Cliente:</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>
            
            <label for="valor">Valor da compra (R$):</label>
            <input type="number" id="valor" placeholder="Ex: 150,00" required>

            <label for="parcelas">Parcelar em: </label>
            <select id="parcelas">
                <option value="1">À vista</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
            </select>
            <button type="button" onclick="calcular()">Calcular</button>
        </form>
        <section id="resultado" class="resultado"></section>
        <footer>
            <p>Desenvolvido com JavaScript</p>
        </footer>
    </div>
    <script src="script01.js"></script>
</body>

</html>
